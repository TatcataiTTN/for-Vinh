name: nlp-verify
# Kiểm tra tự động site "Tối ưu hóa phi tuyến & lồi": số liệu, lời giải mẫu bài tập code, script ví dụ.
on:
  push:
    paths: ['non-linear-programming/**', '.github/workflows/nlp-verify.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: non-linear-programming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cài thư viện
        run: pip install numpy scipy sympy cvxpy pytest
      - name: Kiểm chứng số liệu (verify_all.py chạy được độc lập)
        run: python dev/verify/verify_all.py > /dev/null
      - name: Đối chiếu lời giải mẫu bài tập chạy trên web (numpy/sympy)
        run: python -m pytest -q dev/code/exercises/test_reference.py
      - name: Lời giải mẫu bài tập cvxpy phải đạt mọi test
        run: NLP_USE_SOLUTIONS=1 python -m pytest -q code/cvxpy_bai_tap/test_bai_tap_cvxpy.py
      - name: Script ví dụ phải chạy không lỗi
        run: |
          python code/scripts/01_cvxpy_bai_mau.py
          python code/scripts/02_kkt_vi_du_slide2.py
          python code/scripts/03_qp_vi_du_slide3.py
